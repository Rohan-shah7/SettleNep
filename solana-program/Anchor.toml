skip_local_validator = true

[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
settlenep = "GFqpc53KGyUi1BGraoZxVCczM6iUCkRQdB8HfnBiH9RZ"

[programs.devnet]
settlenep = "GFqpc53KGyUi1BGraoZxVCczM6iUCkRQdB8HfnBiH9RZ"

[provider]
# Keep the provider on localnet so `anchor test` runs the LiteSVM cargo-test
# suite locally. Deploy to Devnet explicitly with:
#   anchor deploy --provider.cluster devnet
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"

[hooks]
