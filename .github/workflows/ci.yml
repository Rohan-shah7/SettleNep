name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  program:
    name: Program (build + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache Solana (Agave) toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana
          key: solana-cli-3.1.10

      - name: Install Solana (Agave) CLI
        # Provides cargo-build-sbf. Anchor is intentionally not used in CI:
        # `anchor build` requires the gitignored deploy keypair (Program ID
        # mismatch), whereas cargo-build-sbf compiles the same artifact without it.
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build SBF program artifact
        # The LiteSVM tests load target/deploy/settlenep.so at compile time
        # (include_bytes!), so the SBF artifact must exist before `cargo test`.
        run: cargo build-sbf --sbf-out-dir "$GITHUB_WORKSPACE/solana-program/target/deploy"
        working-directory: solana-program/programs/settlenep

      - name: Run Rust tests (LiteSVM, no validator required)
        run: |
          set +e
          cargo test 2>&1 | tee /tmp/test.log
          ec=${PIPESTATUS[0]}
          if [ "$ec" -ne 0 ]; then
            msg=$(tail -12 /tmp/test.log | tr '\r\n' '  ')
            echo "::error title=Rust tests failed::$msg"
          fi
          exit "$ec"
        working-directory: solana-program

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build