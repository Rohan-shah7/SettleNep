name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  program:
    name: Program (build + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache Anchor CLI binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-1.1.2

      - name: Install Anchor CLI (pinned to project version)
        # Compile with limited parallelism: the anchor-cli dependency tree is
        # large and the GitHub runner OOMs rustc at the default job count.
        run: CARGO_BUILD_JOBS=2 cargo install --locked --version 1.1.2 anchor-cli

      - name: Build program
        # Capture the tail of the build output into a workflow annotation so
        # the real panic/error is readable via check annotations (temporary).
        run: |
          set +e
          NO_DNA=1 CARGO_BUILD_JOBS=2 RUST_BACKTRACE=1 anchor build 2>&1 | tee /tmp/build.log
          ec=${PIPESTATUS[0]}
          if [ "$ec" -ne 0 ]; then
            msg=$(tail -12 /tmp/build.log | tr '\r\n' '  ')
            echo "::error title=Program build failed::$msg"
          fi
          exit "$ec"
        working-directory: solana-program

      - name: Run Rust tests (LiteSVM, no validator required)
        run: |
          set +e
          CARGO_BUILD_JOBS=2 cargo test 2>&1 | tee /tmp/test.log
          ec=${PIPESTATUS[0]}
          if [ "$ec" -ne 0 ]; then
            msg=$(tail -12 /tmp/test.log | tr '\r\n' '  ')
            echo "::error title=Rust tests failed::$msg"
          fi
          exit "$ec"
        working-directory: solana-program

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build