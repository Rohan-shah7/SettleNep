name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  program:
    name: Program (build + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache Anchor CLI binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-1.1.2

      - name: Install Anchor CLI (pinned to project version)
        run: cargo install --locked --version 1.1.2 anchor-cli

      - name: Restore deploy keypair (optional, from secret)
        # anchor build hard-fails with "Program ID mismatch" if the deploy
        # keypair under target/deploy is missing (it is gitignored). Decode it
        # from the SETTLENEP_DEPLOY_KEY secret when configured; otherwise CI
        # falls back to plain cargo build below.
        run: |
          if [ -n "$SETTLENEP_DEPLOY_KEY" ]; then
            mkdir -p target/deploy
            printf '%s' "$SETTLENEP_DEPLOY_KEY" | base64 -d > target/deploy/settlenep-keypair.json
            echo "::notice title=Deploy keypair restored::base64 secret decoded to target/deploy/settlenep-keypair.json"
          fi
        working-directory: solana-program
        env:
          SETTLENEP_DEPLOY_KEY: ${{ secrets.SETTLENEP_DEPLOY_KEY }}

      - name: Build program
        run: |
          set +e
          if [ -f target/deploy/settlenep-keypair.json ]; then
            NO_DNA=1 CARGO_BUILD_JOBS=2 RUST_BACKTRACE=1 anchor build 2>&1 | tee /tmp/build.log
          else
            echo "::notice title=Anchor build skipped::deploy keypair absent in CI; verifying compilation with cargo build instead"
            NO_DNA=1 cargo build 2>&1 | tee /tmp/build.log
          fi
          ec=${PIPESTATUS[0]}
          if [ "$ec" -ne 0 ]; then
            msg=$(tail -12 /tmp/build.log | tr '\r\n' '  ')
            echo "::error title=Build step failed::$msg"
          fi
          exit "$ec"
        working-directory: solana-program

      - name: Run Rust tests (LiteSVM, no validator required)
        run: |
          set +e
          CARGO_BUILD_JOBS=2 cargo test 2>&1 | tee /tmp/test.log
          ec=${PIPESTATUS[0]}
          if [ "$ec" -ne 0 ]; then
            msg=$(tail -12 /tmp/test.log | tr '\r\n' '  ')
            echo "::error title=Rust tests failed::$msg"
          fi
          exit "$ec"
        working-directory: solana-program

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build